<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses & Batches | APEX Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased" x-data="coursesApp()" x-init="fetchCourses()">

  <header class="sticky top-0 z-40 w-full backdrop-blur-xl bg-slate-950/70 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center">
          <i class="fa-solid fa-graduation-cap text-xl text-white"></i>
        </div>
        <span class="text-2xl font-black tracking-tight text-white font-['Outfit']">APEX<span class="text-indigo-400">.</span>EDU</span>
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
        <a href="index.html" class="hover:text-white transition">Home</a>
        <a href="courses.html" class="text-indigo-400 font-semibold">Programs & Batches</a>
        <a href="materials.html" class="hover:text-white transition">Study Hub (PDFs)</a>
        <a href="gallery.html" class="hover:text-white transition">Campus Gallery</a>
        <a href="contact.html" class="hover:text-white transition">Contact & Centers</a>
      </nav>
      <a href="contact.html" class="hidden md:inline-flex px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs uppercase tracking-wider transition">
        Enroll Today
      </a>
    </div>
  </header>

  <div class="py-16 text-center max-w-4xl mx-auto px-4">
    <span class="text-xs font-bold tracking-widest text-indigo-400 uppercase">Curriculum & Programs</span>
    <h1 class="text-4xl sm:text-5xl font-black text-white mt-2">Engineered for Top AIR Aspirants</h1>
    <p class="text-slate-400 text-sm sm:text-base mt-3">Select your target exam and explore comprehensive batch structures with topic-by-topic syllabus breakdowns.</p>

    <div class="flex flex-wrap items-center justify-center gap-2 mt-8">
      <template x-for="cat in categories" :key="cat">
        <button @click="selectedCategory = cat"
                :class="selectedCategory === cat ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800'"
                class="px-5 py-2 rounded-xl text-xs font-bold transition"
                x-text="cat">
        </button>
      </template>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24 space-y-12">
    <div x-show="loading" class="text-center py-20 text-slate-500">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-500 mb-3"></i>
      <p>Loading course modules...</p>
    </div>

    <template x-for="course in filteredCourses" :key="course.id">
      <div class="glass-panel rounded-3xl p-6 sm:p-10 border border-slate-800 relative overflow-hidden transition-all duration-300 hover:border-indigo-500/30">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          
          <div class="lg:col-span-7 space-y-6">
            <div class="flex flex-wrap items-center gap-3">
              <span class="px-3.5 py-1 rounded-full text-xs font-extrabold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20" x-text="course.badge"></span>
              <span class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-clock text-slate-500"></i> <span x-text="course.duration"></span></span>
              <span class="text-xs text-amber-400 flex items-center gap-1"><i class="fa-solid fa-star"></i> <span x-text="course.rating"></span> (<span x-text="course.studentsEnrolled"></span> Enrolled)</span>
            </div>

            <h2 class="text-2xl sm:text-3xl font-extrabold text-white" x-text="course.title"></h2>
            <p class="text-sm text-slate-300 leading-relaxed" x-text="course.description"></p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
              <template x-for="feat in course.features" :key="feat">
                <div class="flex items-start gap-2.5 text-xs text-slate-300">
                  <i class="fa-solid fa-circle-check text-emerald-400 mt-0.5"></i>
                  <span x-text="feat"></span>
                </div>
              </template>
            </div>

            <div class="pt-4 border-t border-slate-800/80 space-y-3" x-data="{ expandedModule: null }">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Detailed Syllabus Breakdown:</h4>
              <template x-for="(module, idx) in course.syllabus" :key="idx">
                <div class="rounded-xl bg-slate-900/60 border border-slate-800/80 overflow-hidden">
                  <button @click="expandedModule = (expandedModule === idx ? null : idx)" class="w-full px-4 py-3 flex items-center justify-between text-left text-xs font-bold text-slate-200 hover:text-white">
                    <span class="flex items-center gap-2">
                      <i class="fa-solid fa-book-bookmark text-indigo-400"></i>
                      <span x-text="module.moduleTitle"></span>
                    </span>
                    <i class="fa-solid fa-chevron-down text-slate-500 transition-transform" :class="expandedModule === idx ? 'rotate-180 text-indigo-400' : ''"></i>
                  </button>
                  <div x-show="expandedModule === idx" x-collapse class="px-4 pb-4 pt-1 text-xs text-slate-400 bg-slate-950/40 border-t border-slate-800/40">
                    <ul class="list-disc list-inside space-y-1">
                      <template x-for="topic in module.topics" :key="topic">
                        <li x-text="topic"></li>
                      </template>
                    </ul>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="lg:col-span-5 bg-slate-900/90 rounded-2xl p-6 border border-slate-700/60 space-y-6">
            <img :src="course.image" :alt="course.title" class="w-full h-44 object-cover rounded-xl border border-slate-700">
            <div>
              <span class="text-xs text-slate-400">Tuition Fee:</span>
              <div class="flex items-baseline gap-2">
                <span class="text-3xl font-black text-white font-['Outfit']" x-text="course.price"></span>
                <span class="text-xs text-slate-400" x-text="course.period"></span>
              </div>
              <p class="text-[11px] text-emerald-400 mt-1"><i class="fa-solid fa-bolt"></i> Up to 100% Scholarship Available via ASTHE</p>
            </div>

            <div class="space-y-3">
              <a :href="'contact.html?course=' + encodeURIComponent(course.title)" class="block w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-center rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                Enroll In This Program
              </a>
              <a :href="'https://wa.me/919876543210?text=' + encodeURIComponent('Hi, I am interested in admission for ' + course.title + '. Please share syllabus and scholarship details.')" target="_blank" class="block w-full py-3.5 bg-emerald-700/30 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 font-bold text-center rounded-xl text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-whatsapp text-base"></i> Chat on WhatsApp
              </a>
            </div>
          </div>

        </div>
      </div>
    </template>
  </main>

  <script>
    function coursesApp() {
      return {
        courses: [],
        categories: ['All', 'Engineering', 'Medical', 'Foundation'],
        selectedCategory: 'All',
        loading: true,
        async fetchCourses() {
          try {
            const res = await fetch('data/courses.json');
            this.courses = await res.json();
          } catch (e) {
            console.error('Failed to load courses:', e);
          } finally {
            this.loading = false;
          }
        },
        get filteredCourses() {
          if (this.selectedCategory === 'All') return this.courses;
          return this.courses.filter(c => c.category.toLowerCase() === this.selectedCategory.toLowerCase());
        }
      }
    }
  </script>
</body>
</html>
