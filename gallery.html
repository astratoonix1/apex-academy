<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Life & Hall of Fame | APEX Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/zoom/lg-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/thumbnail/lg-thumbnail.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased" x-data="galleryApp()" x-init="initGallery()">

  <header class="sticky top-0 z-40 w-full backdrop-blur-xl bg-slate-950/70 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center">
          <i class="fa-solid fa-graduation-cap text-xl text-white"></i>
        </div>
        <span class="text-2xl font-black tracking-tight text-white font-['Outfit']">APEX<span class="text-indigo-400">.</span>EDU</span>
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
        <a href="index.html" class="hover:text-white transition">Home</a>
        <a href="courses.html" class="hover:text-white transition">Programs & Batches</a>
        <a href="materials.html" class="hover:text-white transition">Study Hub (PDFs)</a>
        <a href="gallery.html" class="text-indigo-400 font-semibold">Campus Gallery</a>
        <a href="contact.html" class="hover:text-white transition">Contact & Centers</a>
      </nav>
      <a href="contact.html" class="hidden md:inline-flex px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs uppercase tracking-wider transition">
        Visit Campus
      </a>
    </div>
  </header>

  <div class="py-14 text-center max-w-4xl mx-auto px-4">
    <span class="text-xs font-bold tracking-widest text-indigo-400 uppercase">Visual Showcase</span>
    <h1 class="text-4xl sm:text-5xl font-black text-white mt-2">Campus Culture & Rankers</h1>
    <p class="text-slate-400 text-sm sm:text-base mt-2">Explore our smart amphitheaters, high-tech science laboratories, felicitation ceremonies, and seminars.</p>

    <div class="flex flex-wrap items-center justify-center gap-2 mt-8">
      <template x-for="cat in categories" :key="cat">
        <button @click="filterBy(cat)"
                :class="selectedCategory === cat ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'"
                class="px-5 py-2 rounded-xl text-xs font-bold transition"
                x-text="cat">
        </button>
      </template>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24">
    <div id="lightgallery-container" class="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
      <template x-for="item in filteredItems" :key="item.id">
        <a :href="item.fullUrl"
           :data-sub-html="`<h4>${item.title}</h4><p>${item.caption}</p>`"
           class="gallery-item block break-inside-avoid group rounded-2xl overflow-hidden border border-slate-800 bg-slate-900/60 transition-all duration-300 hover:border-indigo-500/40 relative">
          
          <div class="relative overflow-hidden">
            <img :src="item.thumbUrl"
                 :alt="item.title"
                 loading="lazy"
                 class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-500">
            
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-5">
              <span class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-400 mb-1" x-text="item.category"></span>
              <h4 class="text-sm font-bold text-white leading-tight" x-text="item.title"></h4>
              <p class="text-xs text-slate-300 mt-1 line-clamp-2" x-text="item.caption"></p>
            </div>
          </div>

          <div class="p-4 flex items-center justify-between text-xs text-slate-400 bg-slate-900/80 border-t border-slate-800/60">
            <span class="font-semibold text-slate-300" x-text="item.title"></span>
            <span class="text-[10px] text-slate-500" x-text="item.date"></span>
          </div>
        </a>
      </template>
    </div>
  </main>

  <script>
    function galleryApp() {
      return {
        items: [],
        categories: ['All', 'Toppers', 'Classrooms', 'Events'],
        selectedCategory: 'All',
        lgInstance: null,
        async initGallery() {
          try {
            const res = await fetch('data/gallery.json');
            this.items = await res.json();
            this.$nextTick(() => {
              this.refreshLightGallery();
            });
          } catch (e) {
            console.error('Failed to load gallery:', e);
          }
        },
        filterBy(cat) {
          this.selectedCategory = cat;
          this.$nextTick(() => {
            this.refreshLightGallery();
          });
        },
        refreshLightGallery() {
          const container = document.getElementById('lightgallery-container');
          if (this.lgInstance) {
            this.lgInstance.destroy(true);
          }
          if (container && typeof lightGallery !== 'undefined') {
            this.lgInstance = lightGallery(container, {
              selector: '.gallery-item',
              plugins: [lgZoom, lgThumbnail],
              speed: 400,
              thumbnail: true
            });
          }
        },
        get filteredItems() {
          if (this.selectedCategory === 'All') return this.items;
          return this.items.filter(i => i.category.toLowerCase() === this.selectedCategory.toLowerCase());
        }
      }
    }
  </script>
</body>
</html>
